apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teenflow
spec:
  ingressClassName: nginx
  rules:
    - host: teenflow.local
      http:
        paths:
          - path: /api/tasks
            pathType: Prefix
            backend:
              service:
                name: task-service
                port:
                  number: 8080
          - path: /api/planner
            pathType: Prefix
            backend:
              service:
                name: planner-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 80
