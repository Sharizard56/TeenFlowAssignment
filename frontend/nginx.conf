server {
 listen 80;
 server_name _;
 root /usr/share/nginx/html;
 index index.html;
 location / { try_files $uri $uri/ /index.html; }
 location /api/tasks { proxy_pass http://task-service:8080; proxy_set_header Host $host; }
 location /api/planner { proxy_pass http://planner-service:8000; proxy_set_header Host $host; }
}
